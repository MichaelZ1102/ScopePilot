[project]
name = "scopepilot-backend"
version = "0.5.0"
description = "ScopePilot Web Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "python-jose[cryptography]>=3.3,<4",
    "cryptography>=43.0,<44",
    "bcrypt>=4.1,<5",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    # "scopepilot-cli @ file:///${PROJECT_ROOT}/..",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
