[project]
name = "scopepilot-backend"
version = "0.2.0"
description = "ScopePilot Web Backend - FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.7,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<1",
    "scopepilot-cli @ file:///${PROJECT_ROOT}/..",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
