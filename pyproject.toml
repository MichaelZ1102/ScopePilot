[project]
name = "scopepilot-cli"
version = "0.1.0"
description = "ScopePilot CLI - AI Sprint Requirement Analyst for Backend Teams"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
scopepilot = "scopepilot.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopepilot"]
